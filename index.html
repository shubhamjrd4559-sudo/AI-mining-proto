function afterGeo3D(){
  renderGeo3DScene();
  document.querySelectorAll("[data-layer]").forEach(el=> el.addEventListener("change", ()=>{
    APP.geo3d[el.dataset.layer] = el.checked;
    renderGeo3DScene();
  }));
  let rot=0, scale=1;
  const stage = document.getElementById("geo3dStage");
  const applyT = ()=>{ const g = document.getElementById("geo3dGroup"); if(g) g.setAttribute("transform", `translate(450,260) rotate(${rot*0.1}) scale(${scale})`); };
  document.getElementById("g3RotateL").addEventListener("click", ()=>{ rot-=15; applyT(); });
  document.getElementById("g3RotateR").addEventListener("click", ()=>{ rot+=15; applyT(); });
  document.getElementById("g3ZoomIn").addEventListener("click", ()=>{ scale=Math.min(1.5,scale+0.1); applyT(); });
  document.getElementById("g3ZoomOut").addEventListener("click", ()=>{ scale=Math.max(0.6,scale-0.1); applyT(); });
  document.getElementById("g3Reset").addEventListener("click", ()=>{ rot=0; scale=1; applyT(); });
  let dragging=false,lastX=0;
  stage.addEventListener("mousedown", e=>{ dragging=true; lastX=e.clientX; });
  window.addEventListener("mouseup", ()=> dragging=false);
  window.addEventListener("mousemove", e=>{ if(!dragging) return; rot += (e.clientX-lastX)*0.5; lastX=e.clientX; applyT(); });
}
function renderGeo3DScene(){
  document.getElementById("geo3dSvgWrap").innerHTML = buildGeo3DScene(APP.geo3d);
}

    _selectedDatasetId = e.target.value ? parseInt(e.target.value, 10) : null;
    if (_selectedDatasetId) loadDatasetDetails(_selectedDatasetId);
  });

  document.querySelectorAll("[data-mtab]").forEach(btn => {
    btn.addEventListener("click", () => {
      _maintainerTab = btn.dataset.mtab;
      document.querySelectorAll("[data-mtab]").forEach(b => b.classList.toggle("gold", b.dataset.mtab === _maintainerTab));
      renderMaintainerContent();
    });
  });

  document.getElementById("mSuggestionStatusFilter").addEventListener("change", (e) => {
    _mStatusFilter = e.target.value;
    if (_selectedDatasetId) loadDatasetSuggestions(_selectedDatasetId);
  });

  document.getElementById("maintainerGenBtn").addEventListener("click", async () => {
    if (!_selectedDatasetId) { toast("No dataset selected", "Please select a dataset first."); return; }
    toast("Generating fixes", "Running deterministic & contextual analysis...");
    try {
      const res = await window.CMPDI_AI.apiServices.maintainer.generateSuggestions(_selectedDatasetId);
      toast("Fixes generated", `Created ${res.created || 0} suggestion(s).`);
      await loadDatasetDetails(_selectedDatasetId);
    } catch (err) {
      toast("Generation error", err.message || "Failed to generate suggestions.");
    }
  });

  document.getElementById("maintainerApplyBtn").addEventListener("click", async () => {
    if (!_selectedDatasetId) { toast("No dataset selected", "Please select a dataset first."); return; }
    if (!confirm("Apply all APPROVED suggestions to this dataset? This creates permanent audit entries and updates records.")) return;
    toast("Applying fixes", "Writing approved corrections to records atomically...");
    try {
      const res = await window.CMPDI_AI.apiServices.maintainer.apply(_selectedDatasetId);
      toast("Apply complete", `Successfully applied ${res.applied || 0} correction(s). (${res.failed || 0} failed)`);
      await loadDatasetDetails(_selectedDatasetId);
    } catch (err) {
      toast("Apply error", err.message || "Failed to apply changes.");
    }
  });

  document.getElementById("mBatchApproveBtn").addEventListener("click", async () => {
    if (_selectedSuggestionIds.size === 0) { toast("None selected", "Check one or more suggestions to batch approve."); return; }
    try {
      const ids = Array.from(_selectedSuggestionIds);
      const res = await window.CMPDI_AI.apiServices.maintainer.batchReview(ids, 'approve');
      toast("Batch Approved", `Approved ${res.updated || 0} suggestion(s).`);
      _selectedSuggestionIds.clear();
      await loadDatasetSuggestions(_selectedDatasetId);
      await loadDatasetOverviewStats(_selectedDatasetId);
    } catch (err) {
      toast("Review error", err.message);
    }
  });

  document.getElementById("mBatchRejectBtn").addEventListener("click", async () => {
    if (_selectedSuggestionIds.size === 0) { toast("None selected", "Check one or more suggestions to batch reject."); return; }
    try {
      const ids = Array.from(_selectedSuggestionIds);
      const res = await window.CMPDI_AI.apiServices.maintainer.batchReview(ids, 'reject');
      toast("Batch Rejected", `Rejected ${res.updated || 0} suggestion(s).`);
      _selectedSuggestionIds.clear();
      await loadDatasetSuggestions(_selectedDatasetId);
      await loadDatasetOverviewStats(_selectedDatasetId);
    } catch (err) {
      toast("Review error", err.message);
    }
  });

  document.getElementById("maintainerExportXlsxBtn").addEventListener("click", () => downloadMaintainerExport('xlsx'));
  document.getElementById("maintainerExportCsvBtn").addEventListener("click", () => downloadMaintainerExport('csv'));

  await loadMaintainerDatasets();

async function loadMaintainerDatasets(forceRefresh = false) {
  if (!window.CMPDI_AI || !window.CMPDI_AI.isBackendOnline || !window.CMPDI_AI.isBackendOnline()) {
    document.getElementById("maintainerTabContent").innerHTML = `
      <div style="text-align:center; padding:32px; color:#7E8CA3;">
        Backend is currently in demo mock mode. Sign in to view and maintain live extracted datasets.
      </div>`;
    return;
  }
  const select = document.getElementById("maintainerDatasetSelect");
  if (!select) return;

  try {
    const res = await window.CMPDI_AI.apiServices.maintainer.datasets();
    _maintainerDatasets = res.results || [];
    if (_maintainerDatasets.length === 0) {
      select.innerHTML = '<option value="">No datasets found (Upload documents first)</option>';
      document.getElementById("maintainerTabContent").innerHTML = `
        <div style="text-align:center; padding:32px; color:#7E8CA3;">
          No extracted datasets found for your account. Upload a PDF/Excel/CSV document in the <b>Documents</b> tab to extract structured tables.
        </div>`;
      return;
    }

    select.innerHTML = _maintainerDatasets.map(d => `
      <option value="${d.id}" ${_selectedDatasetId === d.id ? 'selected' : ''}>
        ${escapeHtml(d.filename || d.name)} (${(d.file_type || 'DATA').toUpperCase()} · ${d.record_count} rows)
      </option>
    `).join("");

    if (!_selectedDatasetId || forceRefresh || !_maintainerDatasets.some(d => d.id === _selectedDatasetId)) {
      _selectedDatasetId = _maintainerDatasets[0].id;
    }
    select.value = _selectedDatasetId;
    await loadDatasetDetails(_selectedDatasetId);
  } catch (err) {
    select.innerHTML = '<option value="">Error loading datasets</option>';
    toast("Load error", err.message || "Could not load datasets.");
  }
}

async function downloadMaintainerExport(format) {
  if (!_selectedDatasetId) {
    toast("No dataset selected", "Please select a dataset to export.");
    return;
  }
  toast("Export starting", `Generating clean ${format.toUpperCase()} export...`);
  try {
    const token = typeof _getToken === 'function' ? _getToken() : null;
    const headers = { 'Accept': '*/*' };
    if (token) headers['Authorization'] = `Token ${token}`;
    const url = `${API_BASE}/api/maintainer/datasets/${_selectedDatasetId}/export/${format}/`;
    const res = await fetch(url, { headers });
    if (!res.ok) throw new Error(`Export failed (HTTP ${res.status})`);
    const blob = await res.blob();
    const disposition = res.headers.get('Content-Disposition') || '';
    const fnMatch = disposition.match(/filename="([^"]+)"/);
    const filename = fnMatch ? fnMatch[1] : `dataset_${_selectedDatasetId}_maintained.${format}`;
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(blobUrl); }, 1000);
    toast("Export complete", `Saved as ${filename}`);
  } catch (err) {
    toast("Export failed", err.message || "Could not export dataset.");
  }
}

<!-- ============================================================
     PHASE 2 — API Service Boundary (Auth + Pagination + Pipeline fixes)
     ============================================================ -->
<script>
/* ============================================================
   CMPDI AI — API Service Layer (Phase 2 Final Fix Pass)

   Changes from Phase 1:
   - Token-based authentication (DRF TokenAuthentication)
   - Authorization: Token <token> header on all API requests
   - Login modal shown when backend online but not authenticated
   - Pagination: next/previous page navigation for document list
   - Pipeline status: only Upload+Storage marked done after upload
   - Document title rendered safely via textContent (not innerHTML)
   ============================================================ */

const API_BASE = 'http://127.0.0.1:8000';
const API_TIMEOUT_MS = 5000;
const UPLOAD_TIMEOUT_MS = 30000;
const TOKEN_KEY = 'cmpdi_auth_token';

/* --- Token storage (sessionStorage — cleared on tab close) -- */
function _getToken() {
  return sessionStorage.getItem(TOKEN_KEY);
}
function _setToken(token) {
  if (token) sessionStorage.setItem(TOKEN_KEY, token);
  else sessionStorage.removeItem(TOKEN_KEY);
}
function _clearToken() {
  sessionStorage.removeItem(TOKEN_KEY);
}
function isAuthenticated() {
  return Boolean(_getToken());
}

/* --- Auth Headers ------------------------------------------ */
function _authHeaders(extra) {
  const token = _getToken();
  const base = { 'Accept': 'application/json' };
  if (token) base['Authorization'] = `Token ${token}`;
  return Object.assign(base, extra || {});
}

/* --- Low-level fetch helper with timeout + auth header ----- */
async function _apiFetch(path, options = {}) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), API_TIMEOUT_MS);
  // Merge auth headers; caller-supplied headers take precedence
  const headers = _authHeaders(
    options.headers && !(options.body instanceof FormData)
      ? Object.assign({ 'Content-Type': 'application/json' }, options.headers)
      : options.headers
  );
  if (!options.headers && !(options.body instanceof FormData)) {
    headers['Content-Type'] = 'application/json';
  }
  try {
    const res = await fetch(API_BASE + path, {
      signal: controller.signal,
      ...options,
      headers,
    });
    clearTimeout(timer);
    if (!res.ok) {
      let errMsg = `HTTP ${res.status}: ${res.statusText}`;
      try {
        const data = await res.json();
        if (data.error || data.message) errMsg = data.error || data.message;
      } catch (_) {}
      if (res.status === 401 || res.status === 403) {
        // Token may have expired — prompt re-login
        _showLoginModal('Session expired or unauthorized. Please log in again.');
      }
      throw new Error(errMsg);
    }
    return await res.json();
  } catch (err) {
    clearTimeout(timer);
    throw err;
  }
}

/* --- Login / Logout ---------------------------------------- */
async function doLogin(username, password) {
  const res = await fetch(API_BASE + '/api/auth/token/', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify({ username, password }),
  });
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    throw new Error(data.non_field_errors?.[0] || data.detail || 'Invalid credentials.');
  }
  const data = await res.json();
  _setToken(data.token);
  return data.token;
}

function doLogout() {
  _clearToken();
  _backendOnline = false;
  _healthPromise = null;
  _hideLoginModal();
  // Reload the documents view so it reflects logged-out state
  if (typeof loadLiveDocuments === 'function') {
    _liveDocuments = null;
    if (typeof renderDocRows === 'function') renderDocRows();
  }
}

/* --- Login Modal UI ---------------------------------------- */
function _buildLoginModal() {
  if (document.getElementById('cmpdiLoginModal')) return;
  const modal = document.createElement('div');
  modal.id = 'cmpdiLoginModal';
  modal.style.cssText = [
    'position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;',
    'background:rgba(7,26,61,0.72);backdrop-filter:blur(4px);',
  ].join('');
  modal.innerHTML = `
    <div style="background:#fff;border-radius:18px;padding:36px 32px;width:100%;max-width:400px;
                box-shadow:0 24px 60px rgba(7,26,61,.28);position:relative;">
      <div style="font-family:Fraunces,Georgia,serif;font-size:21px;font-weight:700;
                  color:#071A3D;margin-bottom:4px;">CMPDI AI Sign In</div>
      <div style="font-size:13px;color:#7E8CA3;margin-bottom:24px;">
        Authenticate to upload and manage documents.
      </div>
      <div id="loginError" style="display:none;background:#FEE8E8;border-radius:8px;
           padding:10px 14px;font-size:13px;color:#D64545;margin-bottom:16px;"></div>
      <label style="display:block;font-size:12px;font-weight:600;color:#071A3D;margin-bottom:4px;">
        Username
      </label>
      <input id="loginUsername" type="text" autocomplete="username"
        style="width:100%;border:1.5px solid #D1DBE8;border-radius:9px;padding:9px 13px;
               font-size:14px;margin-bottom:14px;outline:none;box-sizing:border-box;"
        placeholder="admin">
      <label style="display:block;font-size:12px;font-weight:600;color:#071A3D;margin-bottom:4px;">
        Password
      </label>
      <input id="loginPassword" type="password" autocomplete="current-password"
        style="width:100%;border:1.5px solid #D1DBE8;border-radius:9px;padding:9px 13px;
               font-size:14px;margin-bottom:20px;outline:none;box-sizing:border-box;"
        placeholder="••••••••">
      <button id="loginSubmitBtn"
        style="width:100%;background:#0B4DB8;color:#fff;border:none;border-radius:10px;
               padding:11px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;">
        Sign In
      </button>
      <div style="font-size:11.5px;color:#9EB0CC;text-align:center;margin-top:16px;" id="loginHint"></div>
    </div>`;
  document.body.appendChild(modal);

  // Inject a generic dev hint if the backend is running in debug/demo mode.
  // No credentials are stored or displayed in the frontend — check your .env file.
  fetch(API_BASE + '/api/health/').then(r => r.json()).then(data => {
    const hintEl = document.getElementById('loginHint');
    if (hintEl && data && data.debug) {
      hintEl.textContent = 'Development mode — use credentials from your .env file.';
    }
  }).catch(() => {});

  const submit = modal.querySelector('#loginSubmitBtn');
  const errEl = modal.querySelector('#loginError');

  async function tryLogin() {
    const username = modal.querySelector('#loginUsername').value.trim();
    const password = modal.querySelector('#loginPassword').value;
    if (!username || !password) {
      errEl.textContent = 'Please enter username and password.';
      errEl.style.display = 'block';
      return;
    }
    submit.disabled = true;
    submit.textContent = 'Signing in…';
    errEl.style.display = 'none';
    try {
      await doLogin(username, password);
      _hideLoginModal();
      // Re-prime health check and reload documents
      _healthPromise = null;
      await ensureBackendStatus();
      if (typeof loadLiveDocuments === 'function') loadLiveDocuments();
    } catch (err) {
      errEl.textContent = err.message || 'Login failed.';
      errEl.style.display = 'block';
    } finally {
      submit.disabled = false;
      submit.textContent = 'Sign In';
    }
  }

  submit.addEventListener('click', tryLogin);
  modal.querySelector('#loginPassword').addEventListener('keydown', e => {
    if (e.key === 'Enter') tryLogin();
  });
}

function _showLoginModal(message) {
  _buildLoginModal();
  const modal = document.getElementById('cmpdiLoginModal');
  if (modal) {
    modal.style.display = 'flex';
    if (message) {
      const errEl = document.getElementById('loginError');
      if (errEl) { errEl.textContent = message; errEl.style.display = 'block'; }
    }
    setTimeout(() => {
      const u = document.getElementById('loginUsername');
      if (u) u.focus();
    }, 50);
  }
}

function _hideLoginModal() {
  const modal = document.getElementById('cmpdiLoginModal');
  if (modal) modal.style.display = 'none';
}

/* --- API Services ------------------------------------------ */
const apiServices = {
  health: () => _apiFetch('/api/health/'),

  auth: {
    login: (username, password) => doLogin(username, password),
    logout: () => doLogout(),
    isAuthenticated: () => isAuthenticated(),
  },

  documents: {
    list: (params) => _apiFetch('/api/documents/' + (params ? '?' + new URLSearchParams(params) : '')),
    get:  (id) => _apiFetch(`/api/documents/${id}/`),
    status: (id) => _apiFetch(`/api/documents/${id}/status/`),
    upload: async (formData) => {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), UPLOAD_TIMEOUT_MS);
      try {
        const headers = {};
        const token = _getToken();
        if (token) headers['Authorization'] = `Token ${token}`;
        const res = await fetch(API_BASE + '/api/documents/', {
          method: 'POST',
          body: formData,
          headers,
          signal: controller.signal,
        });
        clearTimeout(timer);
        const data = await res.json();
        if (!res.ok) {
          if (res.status === 401 || res.status === 403) {
            _showLoginModal('Authentication required to upload documents.');
          }
          throw new Error(data.error || data.message || `Upload failed (HTTP ${res.status})`);
        }
        return data;
      } catch (err) {
        clearTimeout(timer);
        if (err.name === 'AbortError') throw new Error('Upload request timed out after 30 seconds.');
        throw err;
      }
    },
    retry:   (id) => _apiFetch(`/api/documents/${id}/retry/`, { method: 'POST' }),
    archive: (id) => _apiFetch(`/api/documents/${id}/archive/`, { method: 'POST' }),
    delete:  (id, hard = false) => _apiFetch(
      `/api/documents/${id}/` + (hard ? '?hard=true' : ''), { method: 'DELETE' }
    ),
    downloadUrl: (id) => `${API_BASE}/api/documents/${id}/download/`,
  },

  analytics: {
    datasets:   () => _apiFetch('/api/analytics/datasets/'),
    kpi:        (params) => _apiFetch('/api/analytics/kpi/' + (params ? '?' + new URLSearchParams(params) : '')),
    trends:     (params) => _apiFetch('/api/analytics/trends/' + (params ? '?' + new URLSearchParams(params) : '')),
    breakdown:  (params) => _apiFetch('/api/analytics/breakdown/' + (params ? '?' + new URLSearchParams(params) : '')),
    query:      (params) => _apiFetch('/api/analytics/query/', { method: 'POST', body: JSON.stringify(params) }),
    drilldown:  (params) => _apiFetch('/api/analytics/drilldown/' + (params ? '?' + new URLSearchParams(params) : '')),
    summary:    () => _apiFetch('/api/analytics/kpi/'),
    production: (params) => _apiFetch('/api/analytics/trends/' + (params ? '?' + new URLSearchParams(params) : '')),
  },
  explorer: {
    datasets:     () => _apiFetch('/api/datasets/list/'),
    schema:       (id) => _apiFetch(`/api/datasets/${id}/schema/`),
    records:      (id, params) => _apiFetch(`/api/datasets/${id}/records/` + (params ? '?' + new URLSearchParams(params) : '')),
    recordDetail: (id, recordId) => _apiFetch(`/api/datasets/${id}/records/${recordId}/`),
    exportCsvUrl: (id, params) => `${API_BASE}/api/datasets/${id}/export/csv/` + (params ? '?' + new URLSearchParams(params) : ''),
  },
  chat: {
    query: (message, context = {}) =>
      _apiFetch('/api/chat/', { method: 'POST', body: JSON.stringify({ message, context }) }),
  },
  excel: {
    list:  () => _apiFetch('/api/excel/'),
    query: (sheet_id, prompt) =>
      _apiFetch(`/api/excel/${sheet_id}/query/`, { method: 'POST', body: JSON.stringify({ prompt }) }),
  },
  reports: {
    list:     () => _apiFetch('/api/reports/'),
    generate: (params) => _apiFetch('/api/reports/', { method: 'POST', body: JSON.stringify(params) }),
  },
  topics: {
    list: () => _apiFetch('/api/topics/'),
  },
  audit: {
    list: (params) => _apiFetch('/api/audit/' + (params ? '?' + new URLSearchParams(params) : '')),
  },
  maintainer: {
    datasets: (params) => _apiFetch('/api/maintainer/datasets/' + (params ? '?' + new URLSearchParams(params) : '')),
    overview: (id) => _apiFetch(`/api/maintainer/datasets/${id}/overview/`),
    records: (id, params) => _apiFetch(`/api/maintainer/datasets/${id}/records/` + (params ? '?' + new URLSearchParams(params) : '')),
    suggestions: (id, params) => _apiFetch(`/api/maintainer/datasets/${id}/suggestions/` + (params ? '?' + new URLSearchParams(params) : '')),
    validationIssues: (id, params) => _apiFetch(`/api/maintainer/datasets/${id}/validation-issues/` + (params ? '?' + new URLSearchParams(params) : '')),
    generateSuggestions: (id) => _apiFetch(`/api/maintainer/datasets/${id}/generate-suggestions/`, { method: 'POST' }),
    approve: (id) => _apiFetch(`/api/maintainer/suggestions/${id}/approve/`, { method: 'POST' }),
    reject: (id) => _apiFetch(`/api/maintainer/suggestions/${id}/reject/`, { method: 'POST' }),
    batchReview: (ids, action) => _apiFetch('/api/maintainer/suggestions/batch-review/', { method: 'POST', body: JSON.stringify({ ids, action }) }),
    apply: (id) => _apiFetch(`/api/maintainer/datasets/${id}/apply/`, { method: 'POST' }),
    exportXlsxUrl: (id) => `${API_BASE}/api/maintainer/datasets/${id}/export/xlsx/`,
    exportCsvUrl: (id) => `${API_BASE}/api/maintainer/datasets/${id}/export/csv/`,
  },
};

/* --- Synchronized Health Check ----------------------------- */
let _backendOnline = false;
let _healthPromise = null;

function ensureBackendStatus() {
  if (!_healthPromise) {
    _healthPromise = apiServices.health()
      .then(health => {
        _backendOnline = true;
        console.info('%c[CMPDI AI] Backend connected', 'color:#1E9E63; font-weight:bold;', health);
        const msg = document.getElementById("uploadZoneMsg");
        if (msg) msg.textContent = "Real document storage active. Uploaded files are verified and stored safely on server.";
        // If backend is online but no token, prompt login
        if (!isAuthenticated()) {
          _showLoginModal();
        }
        return true;
      })
      .catch(_err => {
        _backendOnline = false;
        console.info('%c[CMPDI AI] Backend offline. Demo mock mode active.', 'color:#DFAE24; font-weight:bold;');
        const msg = document.getElementById("uploadZoneMsg");
        if (msg) msg.textContent = "Backend connection required for real file upload. (Demo mode active for viewing).";
        return false;
      });
  }
  return _healthPromise;
}

// Kick off initial health check
ensureBackendStatus();

/* Expose for application use */
window.CMPDI_AI = window.CMPDI_AI || {};
window.CMPDI_AI.apiServices = apiServices;
window.CMPDI_AI.isBackendOnline = () => _backendOnline;
window.CMPDI_AI.isAuthenticated = () => isAuthenticated();
window.CMPDI_AI.ensureBackendStatus = ensureBackendStatus;
window.CMPDI_AI.API_BASE = API_BASE;
window.CMPDI_AI.showLoginModal = _showLoginModal;
window.CMPDI_AI.doLogout = doLogout;
</script>
</body>
</html>
