<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CMPDI AI — Mining Intelligence Command Center</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="SIH26023 — AI-Powered Geological, Mining and Reporting Solution prototype for CMPDI/CIL subsidiaries.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>/* ============================================================
   CMPDI AI — Mining Intelligence Command Center
   Design tokens
   ============================================================ */
:root{
  --navy:#071A3D;
  --navy-2:#0A2451;
  --royal:#0B4DB8;
  --blue:#1976D2;
  --light-blue:#EAF4FF;
  --gold:#DFAE24;
  --yellow:#F4C542;
  --white:#FFFFFF;
  --gray:#F5F7FA;
  --charcoal:#202936;
  --earth:#8B6B4A;
  --earth-dark:#5E4530;
  --green:#1E9E63;
  --red:#D64545;

  --font-display:'Fraunces', 'Cambria', Georgia, serif;
  --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono:'IBM Plex Mono', 'Consolas', monospace;

  --radius-card:20px;
  --radius-sm:12px;
  --shadow-1: 0 1px 2px rgba(7,26,61,.06), 0 2px 8px rgba(7,26,61,.06);
  --shadow-2: 0 8px 24px rgba(7,26,61,.14), 0 2px 6px rgba(7,26,61,.08);
  --shadow-gold: 0 0 0 1px rgba(223,174,36,.35), 0 8px 20px rgba(223,174,36,.18);
  --sidebar-w: 264px;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:var(--font-body);
  background:var(--gray);
  color:var(--charcoal);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; color:var(--navy);}
p{margin:0;}
button{font-family:inherit; cursor:pointer;}
a{color:inherit;}
::selection{background:rgba(11,77,184,.2);}

/* Scrollbars */
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(7,26,61,.18); border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:rgba(7,26,61,.3);}

/* Focus states */
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--blue);
  outline-offset:2px;
  border-radius:6px;
}

/* ============================================================
   App shell
   ============================================================ */
.app-shell{
  display:grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  min-height:100vh;
}

/* ---------------- Sidebar ---------------- */
.sidebar{
  background: linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 55%, #081B42 100%);
  color:#CFE0FF;
  padding:22px 16px 18px;
  display:flex;
  flex-direction:column;
  position:relative;
  z-index:20;
  border-right:1px solid rgba(255,255,255,.06);
}
.sidebar::before{
  /* subtle contour lines watermark */
  content:"";
  position:absolute; inset:0;
  background-image:
    repeating-radial-gradient(circle at 20% 10%, rgba(223,174,36,.05) 0px, rgba(223,174,36,0) 2px, transparent 40px),
    repeating-linear-gradient(115deg, rgba(255,255,255,.025) 0px, rgba(255,255,255,.025) 1px, transparent 1px, transparent 26px);
  pointer-events:none;
}
.brand{
  display:flex; align-items:center; gap:11px;
  padding:6px 8px 20px;
  position:relative;
  border-bottom:1px solid rgba(255,255,255,.08);
  margin-bottom:14px;
}
.brand-mark{
  width:40px; height:40px; border-radius:11px;
  background:linear-gradient(140deg, var(--gold), #B98A16);
  display:flex; align-items:center; justify-content:center;
  font-size:19px; box-shadow:0 4px 14px rgba(223,174,36,.35);
  flex:none;
}
.brand-text .name{font-family:var(--font-display); font-weight:600; font-size:17px; color:#fff; letter-spacing:.2px;}
.brand-text .sub{font-size:11px; color:#8FADE0; letter-spacing:.5px; text-transform:uppercase; margin-top:1px;}

.nav-group-label{
  font-size:10.5px; letter-spacing:1.2px; text-transform:uppercase;
  color:#5E80B8; padding:14px 10px 6px; font-weight:600;
}
.nav{
  list-style:none; margin:0; padding:0; position:relative;
  display:flex; flex-direction:column; gap:2px;
}
.nav-item{
  display:flex; align-items:center; gap:11px;
  padding:9px 12px; border-radius:10px;
  color:#B9CDEF; font-size:13.5px; font-weight:500;
  cursor:pointer; position:relative;
  transition:background .15s ease, color .15s ease, transform .15s ease;
  border:1px solid transparent;
}
.nav-item .ic{width:17px; text-align:center; font-size:14.5px; opacity:.9;}
.nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav-item.active{
  color:#fff;
  background:linear-gradient(90deg, rgba(11,77,184,.55), rgba(25,118,210,.28));
  border-color:rgba(223,174,36,.35);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.04);
}
.nav-item.active::before{
  content:"";
  position:absolute; left:-16px; top:50%; transform:translateY(-50%);
  width:4px; height:60%; border-radius:4px;
  background:linear-gradient(180deg, var(--gold), var(--yellow));
  box-shadow:0 0 10px rgba(223,174,36,.7);
}
.sidebar-spacer{flex:1;}
.sidebar-bottom{border-top:1px solid rgba(255,255,255,.08); padding-top:10px; margin-top:8px;}
.sidebar-user{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:12px;
  background:rgba(255,255,255,.04); margin-top:6px; cursor:pointer;
}
.sidebar-user:hover{background:rgba(255,255,255,.08);}
.avatar-chip{
  width:32px; height:32px; border-radius:50%; flex:none;
  background:linear-gradient(140deg, var(--blue), var(--royal));
  display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:12px;
}
.sidebar-user .who{font-size:12.5px; color:#fff; font-weight:600; line-height:1.2;}
.sidebar-user .role{font-size:10.5px; color:#7E9DD2;}

/* ---------------- Main column ---------------- */
.main-col{display:flex; flex-direction:column; min-width:0;}

/* Header */
.topbar{
  height:68px; flex:none;
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(10px);
  border-bottom:1px solid #E4E9F2;
  display:flex; align-items:center; gap:16px;
  padding:0 24px;
  position:sticky; top:0; z-index:15;
}
.hamburger{display:none; background:none; border:none; font-size:20px; color:var(--navy); padding:6px;}
.global-search{
  position:relative; flex:1; max-width:520px;
}
.global-search input{
  width:100%; border:1px solid #DCE4F0; background:var(--gray);
  border-radius:12px; padding:10px 14px 10px 38px; font-size:13.5px; color:var(--charcoal);
  transition:border-color .15s, box-shadow .15s;
}
.global-search input:focus{outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(25,118,210,.14); background:#fff;}
.global-search .gs-icon{position:absolute; left:13px; top:50%; transform:translateY(-50%); color:#7E8CA3; font-size:14px;}
.gs-results{
  position:absolute; top:calc(100% + 8px); left:0; right:0;
  background:#fff; border:1px solid #E4E9F2; border-radius:14px; box-shadow:var(--shadow-2);
  max-height:360px; overflow:auto; padding:8px; display:none; z-index:40;
}
.gs-results.show{display:block;}
.gs-item{padding:10px 12px; border-radius:10px; cursor:pointer; display:flex; flex-direction:column; gap:2px;}
.gs-item:hover{background:var(--light-blue);}
.gs-item .t{font-size:13px; font-weight:600; color:var(--navy);}
.gs-item .m{font-size:11px; color:#7E8CA3;}
.gs-empty{padding:16px; text-align:center; font-size:12.5px; color:#9AA7BC;}

.topbar-right{display:flex; align-items:center; gap:14px; margin-left:auto;}
.icon-btn{
  width:38px; height:38px; border-radius:11px; border:1px solid #E4E9F2; background:#fff;
  display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--navy);
  position:relative; transition:box-shadow .15s, border-color .15s;
}
.icon-btn:hover{border-color:var(--blue); box-shadow:0 0 0 3px rgba(25,118,210,.1);}
.icon-btn .dot{position:absolute; top:6px; right:7px; width:7px; height:7px; border-radius:50%; background:var(--gold); border:1.5px solid #fff;}
.env-pill{
  font-size:10.5px; font-weight:700; letter-spacing:.4px; text-transform:uppercase;
  color:var(--earth-dark); background:#FBF1DA; border:1px solid #EAD9A8; padding:5px 10px; border-radius:20px;
}

/* Content */
.content{
  flex:1; padding:24px 28px 60px;
  position:relative;
  background:
    radial-gradient(1100px 500px at 88% -8%, rgba(25,118,210,.06), transparent 60%),
    var(--gray);
}
.page{display:none; animation:fadein .35s ease;}
.page.active{display:block;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

.page-head{margin-bottom:20px;}
.page-head .eyebrow{font-size:11px; letter-spacing:1.4px; text-transform:uppercase; color:var(--blue); font-weight:700; margin-bottom:6px;}
.page-head h1{font-size:26px; font-weight:600;}
.page-head p{color:#5A6B85; font-size:13.5px; margin-top:6px; max-width:640px;}

/* ============================================================
   Geological background watermark (behind all content)
   ============================================================ */
.geo-bg{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  left:var(--sidebar-w);
}
.geo-bg svg{width:100%; height:100%;}

/* ============================================================
   Cards
   ============================================================ */
.card{
  background:#fff; border-radius:var(--radius-card);
  border:1px solid #E9EDF5; box-shadow:var(--shadow-1);
  position:relative;
}
.card-pad{padding:20px;}
.card-title-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px;}
.card-title-row h3{font-size:15.5px; font-weight:600; color:var(--navy);}
.card-title-row .sub{font-size:11.5px; color:#8593A8; margin-top:2px;}

/* KPI cards */
.kpi-grid{display:grid; grid-template-columns:repeat(5, 1fr); gap:14px; margin:18px 0 22px;}
.kpi-card{
  background:linear-gradient(165deg, #fff 0%, #FBFDFF 100%);
  border:1px solid #E9EDF5; border-radius:18px; padding:16px 16px 15px;
  box-shadow:var(--shadow-1);
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  cursor:default;
  position:relative; overflow:hidden;
}
.kpi-card::after{
  content:""; position:absolute; right:-30px; top:-30px; width:90px; height:90px; border-radius:50%;
  background:radial-gradient(circle, rgba(25,118,210,.10), transparent 70%);
}
.kpi-card:hover{transform:translateY(-4px); box-shadow:var(--shadow-2); border-color:rgba(25,118,210,.25);}
.kpi-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.kpi-icon{
  width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(140deg, var(--light-blue), #DCEBFF); color:var(--royal); font-size:14px;
  transition:transform .18s ease;
}
.kpi-card:hover .kpi-icon{transform:scale(1.12);}
.badge{
  font-size:9.5px; font-weight:700; letter-spacing:.3px; text-transform:uppercase;
  padding:3px 7px; border-radius:20px;
}
.badge.official{background:#E4F6EA; color:var(--green);}
.badge.demo{background:#FDF1D8; color:var(--earth-dark);}
.badge.prototype{background:#EAF1FF; color:var(--royal);}
.kpi-label{font-size:11.5px; color:#7E8CA3; font-weight:600; letter-spacing:.2px;}
.kpi-value{font-size:22px; font-weight:700; color:var(--navy); font-family:var(--font-display); margin-top:3px;}
.kpi-delta{font-size:11.5px; font-weight:600; margin-top:6px; display:flex; align-items:center; gap:4px;}
.kpi-delta.up{color:var(--green);}
.kpi-delta.down{color:var(--red);}

/* Small stat cards (production snapshot) */
.stat-mini{
  border:1px solid #E9EDF5; border-radius:16px; padding:14px 15px; background:#fff;
  box-shadow:var(--shadow-1);
}
.stat-mini .l{font-size:11px; color:#8593A8; font-weight:600;}
.stat-mini .v{font-size:19px; font-weight:700; color:var(--navy); font-family:var(--font-display); margin-top:4px;}

/* Buttons */
.btn{
  border-radius:12px; padding:10px 18px; font-size:13.5px; font-weight:600; border:1px solid transparent;
  display:inline-flex; align-items:center; gap:8px; transition:transform .12s ease, box-shadow .12s ease, background .12s;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:linear-gradient(135deg, var(--royal), var(--blue)); color:#fff; box-shadow:0 6px 16px rgba(11,77,184,.28);}
.btn-primary:hover{box-shadow:0 8px 22px rgba(11,77,184,.36);}
.btn-gold{background:linear-gradient(135deg, var(--gold), #C89A1D); color:#3A2C05; box-shadow:0 6px 16px rgba(223,174,36,.3);}
.btn-gold:hover{box-shadow:0 8px 22px rgba(223,174,36,.4);}
.btn-outline{background:#fff; color:var(--navy); border-color:#DCE4F0;}
.btn-outline:hover{border-color:var(--blue); color:var(--blue);}
.btn-ghost{background:transparent; color:#5A6B85; border-color:transparent;}
.btn-ghost:hover{background:#EEF2F8;}
.btn-sm{padding:7px 12px; font-size:12px; border-radius:10px;}
.btn:disabled{opacity:.55; cursor:not-allowed;}

/* Chips */
.chip{
  display:inline-flex; align-items:center; gap:6px;
  border:1px solid #DCE4F0; background:#fff; color:var(--navy);
  padding:8px 13px; border-radius:20px; font-size:12.5px; font-weight:500;
  cursor:pointer; transition:all .15s;
}
.chip:hover{border-color:var(--blue); background:var(--light-blue);}
.chip.gold{border-color:rgba(223,174,36,.5); background:#FCF6E4;}

/* Tag/pill status */
.status-pill{font-size:10.5px; font-weight:700; padding:4px 10px; border-radius:20px; letter-spacing:.2px;}
.status-pill.done{background:#E4F6EA; color:var(--green);}
.status-pill.progress{background:#EAF1FF; color:var(--royal);}
.status-pill.review{background:#FDF1D8; color:var(--earth-dark);}
.status-pill.failed{background:#FBE7E7; color:var(--red);}

/* ============================================================
   Hero (dashboard)
   ============================================================ */
.hero{
  border-radius:26px; overflow:hidden; position:relative;
  background:
    radial-gradient(900px 420px at 100% 0%, rgba(223,174,36,.14), transparent 60%),
    linear-gradient(120deg, var(--navy) 0%, #0C2E63 55%, var(--royal) 130%);
  padding:34px 34px 30px;
  color:#fff;
  display:grid; grid-template-columns:1.15fr 1fr; gap:26px; align-items:center;
  box-shadow:0 20px 50px rgba(7,26,61,.35);
}
.hero-eyebrow{
  display:inline-flex; align-items:center; gap:8px;
  font-size:11px; letter-spacing:1.2px; text-transform:uppercase; font-weight:700;
  color:#FFE9A8; background:rgba(223,174,36,.14); border:1px solid rgba(223,174,36,.35);
  padding:6px 12px; border-radius:20px; margin-bottom:16px;
}
.hero h1{color:#fff; font-size:34px; line-height:1.15; font-weight:600; max-width:520px;}
.hero p.lead{color:#C6D6F2; font-size:14.5px; margin-top:12px; max-width:460px; line-height:1.55;}
.hero-query{
  margin-top:22px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18);
  border-radius:18px; padding:6px 6px 6px 18px; display:flex; align-items:center; gap:10px;
  backdrop-filter:blur(6px);
}
.hero-query input{
  flex:1; background:transparent; border:none; color:#fff; font-size:13.5px; padding:12px 0;
}
.hero-query input::placeholder{color:#9FB4DC;}
.hero-query input:focus{outline:none;}
.hero-actions{display:flex; gap:12px; margin-top:18px; flex-wrap:wrap;}
.hero-mini-note{margin-top:16px; font-size:11px; color:#8FA6D2; display:flex; gap:8px; align-items:center;}

/* Hero 3D geo visual */
.hero-visual{
  position:relative; height:280px; border-radius:20px; overflow:hidden;
  background:radial-gradient(circle at 50% 20%, rgba(255,255,255,.08), transparent 60%);
  border:1px solid rgba(255,255,255,.14);
  cursor:grab;
}
.hero-visual:active{cursor:grabbing;}
.hero-visual svg{width:100%; height:100%; display:block;}
.hero-visual-controls{
  position:absolute; bottom:10px; right:10px; display:flex; gap:6px;
}
.vc-btn{
  width:30px; height:30px; border-radius:9px; background:rgba(7,26,61,.55); border:1px solid rgba(255,255,255,.2);
  color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; backdrop-filter:blur(4px);
}
.vc-btn:hover{background:rgba(11,77,184,.7);}
.hero-visual-caption{
  position:absolute; top:10px; left:12px; font-family:var(--font-mono); font-size:9.5px; color:#9FC0F5;
  letter-spacing:.5px; line-height:1.6;
}

/* ============================================================
   Grid helpers
   ============================================================ */
.grid-2{display:grid; grid-template-columns:2fr 1fr; gap:18px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
.grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
.stack{display:flex; flex-direction:column; gap:16px;}
.row{display:flex; align-items:center; gap:10px;}
.row.between{justify-content:space-between;}
.row.wrap{flex-wrap:wrap;}

/* ============================================================
   Tables
   ============================================================ */
.tbl-wrap{overflow:auto; border-radius:16px; border:1px solid #E9EDF5;}
table.dtable{width:100%; border-collapse:collapse; font-size:12.8px;}
table.dtable thead th{
  text-align:left; background:#F7F9FC; color:#6B7A93; font-weight:700; font-size:10.8px;
  text-transform:uppercase; letter-spacing:.4px; padding:12px 14px; border-bottom:1px solid #E9EDF5; white-space:nowrap;
}
table.dtable tbody td{padding:12px 14px; border-bottom:1px solid #F0F3F8; color:var(--charcoal); vertical-align:middle;}
table.dtable tbody tr{transition:background .12s;}
table.dtable tbody tr:hover{background:#F9FBFE;}
table.dtable tbody tr:last-child td{border-bottom:none;}
.doc-name{font-weight:600; color:var(--navy);}
.link-action{color:var(--blue); font-weight:600; font-size:12px; margin-right:10px;}
.link-action:hover{text-decoration:underline;}

/* Filters row */
.filters{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
.filters select, .filters input[type=text]{
  border:1px solid #DCE4F0; background:#fff; border-radius:10px; padding:8px 12px; font-size:12.5px; color:var(--charcoal);
}
.filters select:focus, .filters input:focus{outline:none; border-color:var(--blue);}

/* ============================================================
   Upload area
   ============================================================ */
.upload-zone{
  border:2px dashed #C7D6EE; border-radius:20px; padding:44px 20px; text-align:center;
  background:linear-gradient(180deg, #fff, var(--light-blue) 180%);
  transition:border-color .15s, background .15s;
}
.upload-zone.drag{border-color:var(--blue); background:#E4F0FF;}
.upload-zone .uic{font-size:34px; color:var(--royal); margin-bottom:10px;}
.upload-zone h4{font-size:15px; color:var(--navy); margin-bottom:6px;}
.upload-zone p{font-size:12.5px; color:#7E8CA3; margin-bottom:16px;}

/* Pipeline steps */
.pipeline{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:18px;}
.pstep{
  display:flex; align-items:center; gap:8px; padding:9px 13px; border-radius:12px;
  background:#F5F7FA; border:1px solid #E9EDF5; font-size:12px; font-weight:600; color:#8593A8;
  transition:all .25s ease;
}
.pstep .pdot{width:8px; height:8px; border-radius:50%; background:#C7CFDC;}
.pstep.active{background:var(--light-blue); border-color:rgba(25,118,210,.3); color:var(--royal);}
.pstep.active .pdot{background:var(--blue); box-shadow:0 0 0 4px rgba(25,118,210,.18);}
.pstep.done{background:#E4F6EA; border-color:rgba(30,158,99,.3); color:var(--green);}
.pstep.done .pdot{background:var(--green);}
.pchevron{color:#C7CFDC; font-size:11px;}

/* ============================================================
   AI Query / Answer
   ============================================================ */
.ai-panel{
  border-radius:22px; padding:24px; background:linear-gradient(160deg, #0C2E63, var(--navy));
  color:#fff; box-shadow:0 16px 40px rgba(7,26,61,.3);
}
.ai-input-row{
  display:flex; gap:10px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18);
  border-radius:16px; padding:6px 6px 6px 16px; align-items:center;
}
.ai-input-row input{flex:1; background:transparent; border:none; color:#fff; padding:12px 0; font-size:14px;}
.ai-input-row input::placeholder{color:#9FB4DC;}
.ai-input-row input:focus{outline:none;}
.chip-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;}
.chip-ai{
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); color:#DCE8FF;
  padding:8px 13px; border-radius:20px; font-size:12px; cursor:pointer; transition:all .15s;
}
.chip-ai:hover{background:rgba(223,174,36,.18); border-color:rgba(223,174,36,.5); color:#FFE9A8;}

.answer-card{
  margin-top:18px; background:#fff; border-radius:18px; padding:20px; border:1px solid #E9EDF5; box-shadow:var(--shadow-1);
}
.answer-card h4{font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--royal); margin-bottom:10px; font-weight:700;}
.answer-text{font-size:14px; line-height:1.65; color:var(--charcoal);}
.source-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:10px; margin-top:14px;}
.source-card{
  border:1px solid #E9EDF5; border-radius:14px; padding:12px 13px; background:#FAFBFD;
}
.source-card .sname{font-size:12.5px; font-weight:700; color:var(--navy);}
.source-card .spage{font-size:11px; color:#8593A8; margin-top:2px;}
.source-card .sconf{font-size:11px; color:var(--green); margin-top:6px; font-weight:600;}
.source-card .svb{font-size:11px; color:var(--blue); font-weight:700; margin-top:8px; display:inline-block;}
.confidence-track{height:6px; border-radius:6px; background:#EEF2F8; margin-top:4px; overflow:hidden;}
.confidence-fill{height:100%; background:linear-gradient(90deg, var(--blue), var(--gold));}
.typing-dots span{display:inline-block; width:6px; height:6px; border-radius:50%; background:#9FC0F5; margin-right:4px; animation:blink 1.2s infinite;}
.typing-dots span:nth-child(2){animation-delay:.2s;}
.typing-dots span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.25;} 40%{opacity:1;}}

/* ============================================================
   Charts (custom svg)
   ============================================================ */
.chart-tooltip{
  position:absolute; background:var(--navy); color:#fff; font-size:11px; padding:6px 10px; border-radius:8px;
  pointer-events:none; opacity:0; transition:opacity .1s; white-space:nowrap; z-index:30; transform:translate(-50%,-115%);
  box-shadow:0 6px 16px rgba(0,0,0,.25);
}
.legend-dot{width:9px; height:9px; border-radius:3px; display:inline-block; margin-right:6px;}

/* ============================================================
   3D Geological view page
   ============================================================ */
.geo3d-stage{
  height:520px; border-radius:24px; position:relative; overflow:hidden;
  background:radial-gradient(1200px 600px at 50% -10%, #123769, var(--navy) 65%);
  border:1px solid #16305F;
  cursor:grab;
}
.geo3d-stage:active{cursor:grabbing;}
.geo3d-stage svg{width:100%; height:100%;}
.geo3d-hud{position:absolute; top:16px; left:18px; font-family:var(--font-mono); font-size:10px; color:#8FADE0; line-height:1.7;}
.geo3d-controls{position:absolute; bottom:16px; right:16px; display:flex; gap:8px;}
.layer-toggle-panel{
  position:absolute; top:16px; right:16px; background:rgba(7,26,61,.72); border:1px solid rgba(255,255,255,.14);
  border-radius:14px; padding:12px 14px; backdrop-filter:blur(6px); min-width:190px;
}
.layer-toggle-panel .lt-title{font-size:10px; letter-spacing:1px; text-transform:uppercase; color:#8FADE0; margin-bottom:8px; font-weight:700;}
.lt-row{display:flex; align-items:center; gap:8px; font-size:12px; color:#DCE8FF; padding:5px 0; cursor:pointer;}
.lt-row input{accent-color:var(--gold);}

/* ============================================================
   Mining map
   ============================================================ */
.map-stage{
  height:520px; border-radius:24px; position:relative; overflow:hidden;
  background:
    radial-gradient(700px 400px at 20% 20%, rgba(25,118,210,.25), transparent 60%),
    linear-gradient(160deg, #0A2451, var(--navy));
  border:1px solid #16305F;
}
.map-stage svg{width:100%; height:100%;}
.map-pin{cursor:pointer;}
.map-pin circle{transition:r .15s;}
.map-pin:hover circle{r:9;}
.map-tooltip{
  position:absolute; background:#fff; border-radius:12px; padding:10px 13px; box-shadow:var(--shadow-2);
  font-size:12px; display:none; z-index:20; min-width:150px;
}
.map-tooltip .mt-name{font-weight:700; color:var(--navy); font-size:12.5px;}
.map-tooltip .mt-meta{color:#8593A8; font-size:11px; margin-top:2px;}

/* ============================================================
   Report wizard
   ============================================================ */
.wizard-steps{display:flex; align-items:center; gap:6px; margin-bottom:24px; flex-wrap:wrap;}
.wstep{
  display:flex; align-items:center; gap:8px; font-size:12px; color:#9AA7BC; font-weight:600;
}
.wstep .num{
  width:26px; height:26px; border-radius:50%; background:#EEF2F8; color:#9AA7BC; display:flex; align-items:center; justify-content:center;
  font-size:11.5px; font-weight:700; transition:all .2s;
}
.wstep.active .num{background:linear-gradient(135deg, var(--royal), var(--blue)); color:#fff;}
.wstep.active{color:var(--navy);}
.wstep.done .num{background:var(--green); color:#fff;}
.wstep.done{color:var(--green);}
.wconnector{width:26px; height:2px; background:#E4E9F2;}

.option-card{
  border:1.5px solid #E4E9F2; border-radius:16px; padding:16px; cursor:pointer; transition:all .15s; background:#fff;
}
.option-card:hover{border-color:var(--blue);}
.option-card.sel{border-color:var(--royal); background:var(--light-blue); box-shadow:0 0 0 3px rgba(11,77,184,.1);}
.option-card .oic{font-size:20px; margin-bottom:8px; color:var(--royal);}
.option-card h4{font-size:13.5px; color:var(--navy);}
.option-card p{font-size:11.5px; color:#8593A8; margin-top:4px;}

.gen-progress{display:flex; flex-direction:column; gap:12px; margin:22px 0;}
.gen-row{display:flex; align-items:center; gap:12px; font-size:13px; color:#8593A8; font-weight:600;}
.gen-row .gic{width:24px; height:24px; border-radius:50%; background:#EEF2F8; display:flex; align-items:center; justify-content:center; font-size:11px; flex:none;}
.gen-row.done{color:var(--navy);}
.gen-row.done .gic{background:var(--green); color:#fff;}
.gen-row.active .gic{background:var(--blue); color:#fff;}

/* ============================================================
   Word cloud
   ============================================================ */
.wordcloud{display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; padding:20px 8px; justify-content:center; min-height:220px;}
.wc-word{font-family:var(--font-display); font-weight:700; color:var(--royal); cursor:default; transition:transform .15s;}
.wc-word:hover{transform:scale(1.08); color:var(--gold);}

/* Topic bars */
.topic-row{margin-bottom:12px;}
.topic-row .tlabel{display:flex; justify-content:space-between; font-size:12.5px; font-weight:600; color:var(--navy); margin-bottom:5px;}
.topic-bar-track{height:9px; border-radius:6px; background:#EEF2F8; overflow:hidden;}
.topic-bar-fill{height:100%; border-radius:6px; background:linear-gradient(90deg, var(--royal), var(--blue));}

/* ============================================================
   Audit trail
   ============================================================ */
.timeline{position:relative; padding-left:26px;}
.timeline::before{content:""; position:absolute; left:8px; top:6px; bottom:6px; width:2px; background:#E4E9F2;}
.tl-item{position:relative; padding-bottom:20px;}
.tl-item::before{
  content:""; position:absolute; left:-26px; top:3px; width:12px; height:12px; border-radius:50%;
  background:var(--blue); border:2px solid #fff; box-shadow:0 0 0 2px #E4E9F2;
}
.tl-item.gold::before{background:var(--gold);}
.tl-item.green::before{background:var(--green);}
.tl-item .tl-title{font-size:13px; font-weight:700; color:var(--navy);}
.tl-item .tl-meta{font-size:11.5px; color:#8593A8; margin-top:2px;}

/* ============================================================
   Modal & Toasts
   ============================================================ */
.modal-overlay{
  position:fixed; inset:0; background:rgba(7,26,61,.55); backdrop-filter:blur(2px);
  display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
}
.modal-overlay.show{display:flex;}
.modal-box{
  background:#fff; border-radius:22px; max-width:760px; width:100%; max-height:86vh; overflow:auto;
  box-shadow:0 30px 70px rgba(7,26,61,.4); animation:modalin .2s ease;
}
@keyframes modalin{from{opacity:0; transform:translateY(14px) scale(.98);} to{opacity:1; transform:none;}}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid #EEF2F8; position:sticky; top:0; background:#fff;}
.modal-close{width:32px; height:32px; border-radius:10px; border:1px solid #E4E9F2; background:#fff; display:flex; align-items:center; justify-content:center;}
.modal-close:hover{background:#F5F7FA;}
.modal-body{padding:22px;}

.toast-stack{position:fixed; bottom:22px; right:22px; display:flex; flex-direction:column; gap:10px; z-index:200;}
.toast{
  background:var(--navy); color:#fff; padding:13px 18px; border-radius:14px; font-size:12.8px; font-weight:500;
  box-shadow:0 12px 30px rgba(7,26,61,.35); display:flex; align-items:center; gap:10px; min-width:260px;
  animation:toastin .25s ease; border-left:3px solid var(--gold);
}
@keyframes toastin{from{opacity:0; transform:translateX(30px);} to{opacity:1; transform:none;}}
.toast .ticon{color:var(--gold);}

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width:1180px){
  .kpi-grid{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:1fr;}
  .hero{grid-template-columns:1fr;}
  .hero-visual{height:220px;}
}
@media (max-width:860px){

  .app-shell{grid-template-columns:1fr;}
  .sidebar{

  }
  .sidebar.open{left:0; box-shadow:0 0 40px rgba(0,0,0,.4);}
  .hamburger{display:flex; align-items:center; justify-content:center;}
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .grid-3{grid-template-columns:1fr;}
  .grid-4{grid-template-columns:repeat(2,1fr);}
  .geo-bg{left:0;}
  .content{padding:16px;}
  .topbar{padding:0 14px; gap:10px;}
  .global-search{max-width:none;}
  .global-search input{padding:10px 12px 10px 34px; font-size:13px;}
  .env-pill{display:none;}
  .topbar-right{margin-left:0;}
}
@media (max-width:600px){
  .hero{padding:24px 20px 22px;}
  .hero h1{font-size:26px;}
  .hero-actions{flex-direction:column; align-items:stretch;}
  .hero-actions .btn{justify-content:center;}
}
@media (max-width:520px){
  .kpi-grid{grid-template-columns:1fr;}
}

.sidebar-scrim{display:none; position:fixed; inset:0; background:rgba(7,26,61,.5); z-index:50;}
.sidebar-scrim.show{display:block;}

/* misc */
.muted{color:#8593A8;}
.mt-8{margin-top:8px;}
.mt-16{margin-top:16px;}
.mt-24{margin-top:24px;}
.small{font-size:11.5px;}
.mono{font-family:var(--font-mono);}
.divider{height:1px; background:#EEF2F8; margin:16px 0;}

/* ============================================================
   Lightweight SVG chart + geological visual builders
   (no external chart library — keeps prototype fast & dependency-free)
   ============================================================ */

const COLORS = {
  navy:"#071A3D", royal:"#0B4DB8", blue:"#1976D2", lightBlue:"#EAF4FF",
  gold:"#DFAE24", yellow:"#F4C542", earth:"#8B6B4A", green:"#1E9E63"
};

function svgEl(tag, attrs){
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for(const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

/* ---------- Bar + line combo chart: production trend ---------- */
function buildProductionChart(container, data, selectedYear, tooltipEl){
  container.innerHTML = "";
  const W = container.clientWidth || 640, H = 260;
  const svg = svgEl("svg", { viewBox:`0 0 ${W} ${H}`, width:"100%", height:H });
  const padL = 46, padB = 30, padT = 16, padR = 12;
  const chartW = W - padL - padR, chartH = H - padT - padB;
  const maxV = Math.max(...data.map(d=>d.india)) * 1.15;

  // gridlines
  for(let i=0;i<=4;i++){
    const y = padT + (chartH/4)*i;
    svg.appendChild(svgEl("line", { x1:padL, x2:W-padR, y1:y, y2:y, stroke:"#EEF2F8", "stroke-width":1 }));
    const val = Math.round(maxV - (maxV/4)*i);
    const t = svgEl("text", { x:padL-8, y:y+4, "text-anchor":"end", "font-size":9.5, fill:"#9AA7BC", "font-family":"Inter" });
    t.textContent = val;
    svg.appendChild(t);
  }

  const bw = chartW / data.length;
  const points = [];

  data.forEach((d,i)=>{
    const x0 = padL + i*bw;
    const barW = bw*0.34;
    const barX = x0 + bw*0.14;
    const barH = (d.cil/maxV)*chartH;
    const barY = padT + chartH - barH;
    const isSel = d.year === selectedYear;
    const rect = svgEl("rect", {
      x:barX, y:barY, width:barW, height:barH, rx:6,
      fill: isSel ? COLORS.gold : COLORS.royal,
      opacity: isSel ? 1 : 0.85,
      class:"bar-seg", "data-year": d.year, "data-val": d.cil, "data-label":"CIL Production"
    });
    svg.appendChild(rect);

    // line point for india total
    const px = x0 + bw*0.62;
    const py = padT + chartH - (d.india/maxV)*chartH;
    points.push([px,py,d]);

    // x label
    const lbl = svgEl("text", { x:x0+bw/2, y:H-8, "text-anchor":"middle", "font-size":10.5, fill: isSel? COLORS.navy : "#8593A8", "font-weight": isSel? 700:500, "font-family":"Inter" });
    lbl.textContent = d.year;
    svg.appendChild(lbl);
  });

  // line path (India total)
  let dPath = "";
  points.forEach((p,i)=>{ dPath += (i===0?"M":"L") + p[0] + "," + p[1] + " "; });
  svg.appendChild(svgEl("path", { d:dPath, fill:"none", stroke:COLORS.blue, "stroke-width":2.5, "stroke-linecap":"round", "stroke-dasharray":"1 0", opacity:.9 }));

  points.forEach((p)=>{
    const c = svgEl("circle", { cx:p[0], cy:p[1], r:4.5, fill:"#fff", stroke:COLORS.blue, "stroke-width":2.5,
      class:"line-pt", "data-year":p[2].year, "data-val":p[2].india, "data-label":"India Production" });
    svg.appendChild(c);
  });

  container.appendChild(svg);

  // tooltip interactions
  if(tooltipEl){
    svg.querySelectorAll(".bar-seg, .line-pt").forEach(node=>{
      node.addEventListener("mousemove", (e)=>{
        const rectBox = container.getBoundingClientRect();
        tooltipEl.style.left = (e.clientX - rectBox.left) + "px";
        tooltipEl.style.top = (e.clientY - rectBox.top) + "px";
        tooltipEl.style.opacity = 1;
        tooltipEl.innerHTML = `<b>${node.getAttribute('data-label')}</b> — ${node.getAttribute('data-year')}: ${node.getAttribute('data-val')} MT`;
      });
      node.addEventListener("mouseleave", ()=>{ tooltipEl.style.opacity = 0; });
    });
  }
}

/* ---------- Horizontal bar chart: subsidiary comparison ---------- */
function buildSubsidiaryChart(container, data, tooltipEl){
  container.innerHTML = "";
  const W = container.clientWidth || 500;
  const rowH = 30, gap = 10;
  const H = data.length*(rowH+gap);
  const padL = 60, padR = 60;
  const maxV = Math.max(...data.map(d=>d.production)) * 1.1;
  const svg = svgEl("svg", { viewBox:`0 0 ${W} ${H}`, width:"100%", height:H });

  data.forEach((d,i)=>{
    const y = i*(rowH+gap);
    const barMaxW = W - padL - padR;
    const barW = (d.production/maxV)*barMaxW;
    const label = svgEl("text", { x:padL-10, y:y+rowH/2+4, "text-anchor":"end", "font-size":11.5, "font-weight":700, fill:COLORS.navy, "font-family":"Inter" });
    label.textContent = d.code;
    svg.appendChild(label);

    svg.appendChild(svgEl("rect", { x:padL, y:y, width:barMaxW, height:rowH, rx:8, fill:"#F2F5FA" }));
    const bar = svgEl("rect", { x:padL, y:y, width:Math.max(barW,4), height:rowH, rx:8, fill:`url(#subGrad)`,
      class:"sub-bar", "data-name":d.name, "data-val":d.production, "data-state": d.state });
    svg.appendChild(bar);

    const val = svgEl("text", { x:padL+Math.max(barW,4)+8, y:y+rowH/2+4, "font-size":11.5, "font-weight":700, fill:COLORS.charcoal, "font-family":"Inter" });
    val.textContent = d.production + " MT";
    svg.appendChild(val);
  });

  const defs = svgEl("defs", {});
  const grad = svgEl("linearGradient", { id:"subGrad", x1:"0", x2:"1", y1:"0", y2:"0" });
  grad.appendChild(svgEl("stop", { offset:"0%", "stop-color":COLORS.royal }));
  grad.appendChild(svgEl("stop", { offset:"100%", "stop-color":COLORS.blue }));
  defs.appendChild(grad);
  svg.insertBefore(defs, svg.firstChild);

  container.appendChild(svg);

  if(tooltipEl){
    svg.querySelectorAll(".sub-bar").forEach(node=>{
      node.addEventListener("mousemove", (e)=>{
        const rectBox = container.getBoundingClientRect();
        tooltipEl.style.left = (e.clientX - rectBox.left) + "px";
        tooltipEl.style.top = (e.clientY - rectBox.top) + "px";
        tooltipEl.style.opacity = 1;
        tooltipEl.innerHTML = `<b>${node.getAttribute('data-name')}</b><br>${node.getAttribute('data-state')} — ${node.getAttribute('data-val')} MT`;
      });
      node.addEventListener("mouseleave", ()=>{ tooltipEl.style.opacity = 0; });
    });
  }
}

/* ---------- Donut chart: coal grade distribution ---------- */
function buildDonutChart(container, segments){
  container.innerHTML = "";
  const size = 180, cx = size/2, cy = size/2, r = 68, stroke = 22;
  const total = segments.reduce((a,s)=>a+s.value,0);
  let angle = -90;
  const svg = svgEl("svg", { viewBox:`0 0 ${size} ${size}`, width:size, height:size });
  segments.forEach(seg=>{
    const frac = seg.value/total;
    const start = angle;
    const end = angle + frac*360;
    angle = end;
    const large = (end-start) > 180 ? 1 : 0;
    const p1 = polar(cx,cy,r,start), p2 = polar(cx,cy,r,end);
    const d = `M ${p1.x} ${p1.y} A ${r} ${r} 0 ${large} 1 ${p2.x} ${p2.y}`;
    const path = svgEl("path", { d, fill:"none", stroke:seg.color, "stroke-width":stroke, "stroke-linecap":"butt" });
    svg.appendChild(path);
  });
  const label = svgEl("text", { x:cx, y:cy-2, "text-anchor":"middle", "font-size":20, "font-weight":700, fill:COLORS.navy, "font-family":"Fraunces" });
  label.textContent = total;
  svg.appendChild(label);
  const sub = svgEl("text", { x:cx, y:cy+16, "text-anchor":"middle", "font-size":9, fill:"#8593A8", "font-family":"Inter" });
  sub.textContent = "SAMPLES";
  svg.appendChild(sub);
  container.appendChild(svg);
}
function polar(cx,cy,r,angleDeg){
  const a = (angleDeg*Math.PI)/180;
  return { x: cx + r*Math.cos(a), y: cy + r*Math.sin(a) };
}

/* ---------- Area chart: topic trends ---------- */
/* Only the first (base) series gets a soft area fill; the rest are drawn as
   clean stroked lines with point markers on top, so overlapping series stay
   legible instead of blending into a muddy composite color. */
function buildAreaChart(container, series){
  container.innerHTML="";
  const W = container.clientWidth || 600, H = 200;
  const padL=30, padR=10, padT=14, padB=24;
  const chartW = W-padL-padR, chartH = H-padT-padB;
  const svg = svgEl("svg", { viewBox:`0 0 ${W} ${H}`, width:"100%", height:H });
  const maxV = Math.max(40, Math.max(...series.flatMap(s=>s.values)) * 1.15);
  const n = series[0].values.length;

  // gridlines
  for(let i=0;i<=3;i++){
    const y = padT + (chartH/3)*i;
    svg.appendChild(svgEl("line", { x1:padL, x2:padL+chartW, y1:y, y2:y, stroke:"#EEF2F8", "stroke-width":1 }));
  }

  series.forEach((s, si)=>{
    let dLine = "", dArea = "";
    const pts = [];
    s.values.forEach((v,i)=>{
      const x = padL + (chartW/(n-1))*i;
      const y = padT + chartH - (v/maxV)*chartH;
      pts.push([x,y]);
      dLine += (i===0?"M":"L")+x+","+y+" ";
      dArea += (i===0? "M"+x+","+(padT+chartH)+" L" : "L")+x+","+y+" ";
    });
    dArea += `L ${padL+chartW},${padT+chartH} Z`;
    if(si===0){
      svg.appendChild(svgEl("path", { d:dArea, fill:s.color, opacity:0.08 }));
    }
    svg.appendChild(svgEl("path", { d:dLine, fill:"none", stroke:s.color, "stroke-width":2.4, "stroke-linecap":"round" }));
    pts.forEach(p=>{
      svg.appendChild(svgEl("circle", { cx:p[0], cy:p[1], r:3.2, fill:"#fff", stroke:s.color, "stroke-width":2 }));
    });
  });
  const labels = ["2021","2022","2023","2024","2025"];
  labels.forEach((l,i)=>{
    const x = padL+(chartW/(n-1))*i;
    const t = svgEl("text", { x, y:H-6, "text-anchor":"middle", "font-size":10, fill:"#9AA7BC", "font-family":"Inter" });
    t.textContent = l; svg.appendChild(t);
  });
  container.appendChild(svg);
}

/* Full-page ambient background — strata, contours, tunnels, boreholes */
function buildGeoBackground(){
  const W = 1600, H = 1000;
  let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">`;
  s += `<defs>
    <linearGradient id="bgStrata" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAF4FF"/>
      <stop offset="100%" stop-color="#F5F7FA"/>
    </linearGradient>
  </defs>`;
  s += `<rect width="${W}" height="${H}" fill="url(#bgStrata)" opacity="0.35"/>`;

  // strata bands (very low opacity)
  const bandColors = ["#0B4DB8","#1976D2","#8B6B4A","#DFAE24","#071A3D"];
  for(let i=0;i<6;i++){
    const y = 140 + i*130;
    const wob = 26;
    let path = `M0,${y}`;
    for(let x=0;x<=W;x+=200){
      path += ` Q${x+100},${y+(i%2===0?wob:-wob)} ${x+200},${y}`;
    }
    s += `<path d="${path}" fill="none" stroke="${bandColors[i%bandColors.length]}" stroke-width="1.2" opacity="0.06"/>`;
  }

  // contour rings
  for(let i=0;i<5;i++){
    const cx = 200 + i*320, cy = 780;
    for(let r=20;r<=100;r+=26){
      s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#0B4DB8" stroke-width="1" opacity="0.045"/>`;
    }
  }

  // GIS grid
  for(let x=0;x<=W;x+=80){
    s += `<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="#0B4DB8" stroke-width="0.5" opacity="0.025"/>`;
  }
  for(let y=0;y<=H;y+=80){
    s += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#0B4DB8" stroke-width="0.5" opacity="0.025"/>`;
  }

  // fault lines
  s += `<path d="M100,900 L500,600 L520,300" stroke="#8B6B4A" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.08" fill="none"/>`;
  s += `<path d="M1100,950 L1300,650 L1250,250" stroke="#8B6B4A" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.08" fill="none"/>`;

  // boreholes + exploration points
  const pts = [[240,220],[480,180],[720,260],[980,200],[1240,240],[360,520],[860,540],[1120,500]];
  pts.forEach(p=>{
    s += `<line x1="${p[0]}" y1="${p[1]}" x2="${p[0]}" y2="${p[1]+70}" stroke="#DFAE24" stroke-width="1" opacity="0.10"/>`;
    s += `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#DFAE24" opacity="0.16"/>`;
  });

  // seismic waves
  for(let i=0;i<3;i++){
    const cx = 1400, cy = 820 - i*40;
    s += `<path d="M${cx-260},${cy} q10,-14 20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0" stroke="#1976D2" stroke-width="1" fill="none" opacity="0.05"/>`;
  }

  // coordinate labels
  const coords = [
    { x:120, y:120, t:"23.4567° N  85.3211° E" },
    { x:1250, y:160, t:"BLOCK-A · SEAM-IV" },
    { x:200, y:900, t:"EXPLORATION ZONE" },
    { x:1300, y:920, t:"21.8974° N  83.1029° E" },
  ];
  coords.forEach(c=>{
    s += `<text x="${c.x}" y="${c.y}" font-family="IBM Plex Mono, monospace" font-size="11" fill="#0B4DB8" opacity="0.10" letter-spacing="1">${c.t}</text>`;
  });

  s += `</svg>`;
  return s;
}

/* Mining map SVG (simple stylized india-block GIS grid with pins) */
function buildMiningMapSVG(mines){
  let s = `<svg viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" style="position:absolute;inset:0;width:100%;height:100%;">`;
  for(let x=0;x<=100;x+=5) s += `<line x1="${x}" y1="0" x2="${x}" y2="100" stroke="#1976D2" stroke-width="0.08" opacity="0.25"/>`;
  for(let y=0;y<=100;y+=5) s += `<line x1="0" y1="${y}" x2="100" y2="${y}" stroke="#1976D2" stroke-width="0.08" opacity="0.25"/>`;
  // contour blobs
  s += `<circle cx="50" cy="50" r="42" fill="none" stroke="#DFAE24" stroke-width="0.1" opacity="0.2"/>`;
  s += `<circle cx="50" cy="50" r="30" fill="none" stroke="#DFAE24" stroke-width="0.1" opacity="0.2"/>`;
  s += `</svg>`;
  return s;
}

/* ---------------- Router ---------------- */
function goTo(page){
  APP.page = page;
  document.querySelectorAll(".nav-item").forEach(el=> el.classList.toggle("active", el.dataset.nav===page));
  const content = document.getElementById("content");
  content.innerHTML = renderPage(page);
  afterRender(page);
  window.scrollTo({top:0, behavior:"smooth"});
}

function renderPage(page){
  switch(page){
    case "dashboard": return pageDashboard();
    case "documents": return pageDocuments();
    case "ai-query": return pageAIQuery();
    case "analytics": return pageAnalytics();
    case "reports": return pageReports();
    case "topics": return pageTopics();
    case "explorer": return pageExplorer();
    case "geo3d": return pageGeo3D();
    case "map": return pageMap();
    case "audit": return pageAudit();
    default: return pageDashboard();
  }
}

function afterRender(page){
  if(page==="dashboard") afterDashboard();
  if(page==="documents") afterDocuments();
  if(page==="ai-query") afterAIQuery();
  if(page==="analytics") afterAnalytics();
  if(page==="reports") afterReports();
  if(page==="topics") afterTopics();
  if(page==="explorer") afterExplorer();
  if(page==="geo3d") afterGeo3D();
  if(page==="map") afterMap();
  if(page==="audit") afterAudit();
}

function simulateUploadPipeline(fileLabel){
  const row = document.getElementById("pipelineRow");
  row.style.display = "flex";
  toast("Upload started", fileLabel);
  const steps = row.querySelectorAll(".pstep");
  steps.forEach(s=> s.classList.remove("active","done"));
  let i = 0;
  const tick = ()=>{
    if(i>0) steps[i-1].classList.remove("active"); if(i>0) steps[i-1].classList.add("done");
    if(i < steps.length){
      steps[i].classList.add("active");
      i++;
      setTimeout(tick, 550);
    } else {
      toast("Processing complete", fileLabel + " indexed successfully.");
    }
  };
  tick();
}

function renderWizard(){
  const labels = ["Report Type","Organization","Date Range","Data Sources","Output"];
  document.getElementById("wizardSteps").innerHTML = labels.map((l,i)=>{
    const n = i+1;
    const cls = n < APP.wizard.step ? "done" : (n===APP.wizard.step ? "active" : "");

  const step = APP.wizard.step;
  if(step===1){
    body.innerHTML = `
      <div class="grid-3">
        ${REPORT_TYPES.map(t=>`<div class="option-card ${APP.wizard.type===t.key?'sel':''}" data-type="${t.key}">

    body.innerHTML = `

        ${["CMPDI (HQ)", ...MOCK.subsidiaries.map(s=>s.code)].map(o=>`<div class="option-card ${APP.wizard.org===o?'sel':''}" data-org="${o}"><h4>${o}</h4><p>Organization / Subsidiary</p></div>`).join("")}

        <button class="btn btn-primary" id="wizNext" ${APP.wizard.org?'':'disabled'}>Continue →</button>
      </div>`;

    document.getElementById("wizBack").addEventListener("click", ()=>{ APP.wizard.step=1; renderWizard(); });

    body.innerHTML = `
      <div class="row wrap" style="gap:10px;">
        ${["FY 2022-23","FY 2023-24","FY 2024-25","FY 2025-26","Custom Range"].map(r=>`<span class="chip ${APP.wizard.range===r?'gold':''}" data-range="${r}">${r}</span>`).join("")}

      <div class="row" style="justify-content:space-between; margin-top:24px;">
        <button class="btn btn-outline" id="wizBack">← Back</button>
        <button class="btn btn-primary" id="wizNext">Continue →</button>
      </div>`;
    document.querySelectorAll("[data-range]").forEach(el=> el.addEventListener("click", ()=>{ APP.wizard.range = el.dataset.range; renderWizard(); }));
    document.getElementById("wizBack").addEventListener("click", ()=>{ APP.wizard.step=2; renderWizard(); });
    document.getElementById("wizNext").addEventListener("click", ()=>{ APP.wizard.step=4; renderWizard(); });
  } else if(step===4){
    const allSources = MOCK.documents.map(d=>d.name);
    body.innerHTML = `
      <div class="stack" style="gap:8px;">
        ${allSources.map(s=>`
          <label class="row" style="border:1px solid #E9EDF5; border-radius:12px; padding:10px 14px; cursor:pointer;">
            <input type="checkbox" data-src="${s}" ${APP.wizard.sources.includes(s)?'checked':''} style="margin-right:10px; accent-color:var(--royal);"> ${s}
          </label>`).join("")}
      </div>
      <div class="row" style="justify-content:space-between; margin-top:20px;">
        <button class="btn btn-outline" id="wizBack">← Back</button>
        <button class="btn btn-primary" id="wizNext">Continue →</button>
      </div>`;
    document.querySelectorAll("[data-src]").forEach(el=> el.addEventListener("change", ()=>{
      const s = el.dataset.src;
      if(el.checked) APP.wizard.sources.push(s); else APP.wizard.sources = APP.wizard.sources.filter(x=>x!==s);
    }));
    document.getElementById("wizBack").addEventListener("click", ()=>{ APP.wizard.step=3; renderWizard(); });
    document.getElementById("wizNext").addEventListener("click", ()=>{ APP.wizard.step=5; renderWizard(); });
  } else if(step===5){
    body.innerHTML = `
      <div class="grid-3" style="grid-template-columns:repeat(3,1fr); max-width:520px;">
        ${["PDF","DOCX","Excel"].map(f=>`<div class="option-card ${APP.wizard.format===f?'sel':''}" data-fmt="${f}" style="text-align:center;"><div class="oic" style="text-align:center;">${f==='PDF'?'📕':f==='DOCX'?'📘':'📗'}</div><h4>${f}</h4></div>`).join("")}

        <button class="btn btn-gold" id="wizGenerate" ${APP.wizard.format?'':'disabled'}>Generate Report</button>
      </div>`;
    document.querySelectorAll("[data-fmt]").forEach(el=> el.addEventListener("click", ()=>{ APP.wizard.format = el.dataset.fmt; renderWizard(); }));
    document.getElementById("wizBack").addEventListener("click", ()=>{ APP.wizard.step=4; renderWizard(); });
    const genBtn = document.getElementById("wizGenerate");
    if(genBtn) genBtn.addEventListener("click", generateReport);
  } else if(step===6){
    const rows = ["Collecting Data","Validating Data","AI Analysis","Generating Report","Adding Source References"];
    body.innerHTML = `
      <div class="gen-progress" id="genProgress">
        ${rows.map((r,i)=>`<div class="gen-row" data-row="${i}"><span class="gic">○</span>${r}</div>`).join("")}
      </div>`;
  } else if(step===7){
    body.innerHTML = `
      <div style="text-align:center; padding:30px 10px;">
        <div style="font-size:44px;">✅</div>
        <h2 style="margin-top:12px;">Report Generated Successfully</h2>
        <p class="muted mt-8">${APP.wizard.type} · ${APP.wizard.org} · ${APP.wizard.range} · ${APP.wizard.format}</p>
        <div class="row" style="justify-content:center; gap:12px; margin-top:22px;">
          <button class="btn btn-outline" id="repPreview">👁 Preview</button>
          <button class="btn btn-primary" id="repDownload">⬇ Download</button>
          <button class="btn btn-ghost" id="repSources">📎 View Sources</button>
        </div>
      </div>`;
    document.getElementById("repPreview").addEventListener("click", ()=> toast("Preview", "Report preview opened (simulated)."));
    document.getElementById("repDownload").addEventListener("click", ()=> toast("Download started", `${APP.wizard.type}.${APP.wizard.format==='Excel'?'xlsx':APP.wizard.format.toLowerCase()}`));
    document.getElementById("repSources").addEventListener("click", ()=> toast("Sources", APP.wizard.sources.join(", ")));
  }
}
function generateReport(){
  APP.wizard.step = 6;
  renderWizard();
  const rows = document.querySelectorAll("#genProgress .gen-row");
  let i=0;
  const tick = ()=>{
    if(i>0){ rows[i-1].classList.remove("active"); rows[i-1].classList.add("done"); rows[i-1].querySelector(".gic").textContent="✓"; }
    if(i < rows.length){
      rows[i].classList.add("active");
      i++;
      setTimeout(tick, 600);
    } else {
      setTimeout(()=>{ APP.wizard.step = 7; renderWizard(); }, 500);
    }
  };
  tick();
}

function layerToggle(key,label){
  return `<label class="lt-row"><input type="checkbox" data-layer="${key}" ${APP.geo3d[key]?'checked':''}> ${label}</label>`;
}
function afterGeo3D(){
  renderGeo3DScene();
  document.querySelectorAll("[data-layer]").forEach(el=> el.addEventListener("change", ()=>{
    APP.geo3d[el.dataset.layer] = el.checked;
    renderGeo3DScene();
  }));
  let rot=0, scale=1;
  const stage = document.getElementById("geo3dStage");
  const applyT = ()=>{ const g = document.getElementById("geo3dGroup"); if(g) g.setAttribute("transform", `translate(450,260) rotate(${rot*0.1}) scale(${scale})`); };
  document.getElementById("g3RotateL").addEventListener("click", ()=>{ rot-=15; applyT(); });
  document.getElementById("g3RotateR").addEventListener("click", ()=>{ rot+=15; applyT(); });
  document.getElementById("g3ZoomIn").addEventListener("click", ()=>{ scale=Math.min(1.5,scale+0.1); applyT(); });
  document.getElementById("g3ZoomOut").addEventListener("click", ()=>{ scale=Math.max(0.6,scale-0.1); applyT(); });
  document.getElementById("g3Reset").addEventListener("click", ()=>{ rot=0; scale=1; applyT(); });
  let dragging=false,lastX=0;
  stage.addEventListener("mousedown", e=>{ dragging=true; lastX=e.clientX; });
  window.addEventListener("mouseup", ()=> dragging=false);
  window.addEventListener("mousemove", e=>{ if(!dragging) return; rot += (e.clientX-lastX)*0.5; lastX=e.clientX; applyT(); });
}
function renderGeo3DScene(){
  document.getElementById("geo3dSvgWrap").innerHTML = buildGeo3DScene(APP.geo3d);
}

      <button class="btn btn-outline btn-sm" id="mapZoomIn">Zoom +</button>
      <button class="btn btn-outline btn-sm" id="mapZoomOut">Zoom −</button>
    </div>
    <div class="map-stage" id="mapStage">
      <div id="mapSvgWrap" style="position:absolute; inset:0;"></div>
      <div class="map-tooltip" id="mapTooltip"></div>
    </div>
  </div>`;
}
function afterMap(){
  renderMapPins();
  document.getElementById("mapSearch").addEventListener("input", renderMapPins);
  document.getElementById("mapSubFilter").addEventListener("change", renderMapPins);
  let scale=1;
  const wrap = ()=> document.getElementById("mapSvgWrap");
  document.getElementById("mapZoomIn").addEventListener("click", ()=>{ scale=Math.min(1.8,scale+0.15); wrap().style.transform=`scale(${scale})`; });
  document.getElementById("mapZoomOut").addEventListener("click", ()=>{ scale=Math.max(0.7,scale-0.15); wrap().style.transform=`scale(${scale})`; });
}
function renderMapPins(){
  const q = (document.getElementById("mapSearch")?.value || "").toLowerCase();
  const sub = document.getElementById("mapSubFilter")?.value || "all";
  const wrap = document.getElementById("mapSvgWrap");
  wrap.innerHTML = buildMiningMapSVG();
  const tooltip = document.getElementById("mapTooltip");
  MOCK.mines.filter(m=> (sub==="all"||m.subsidiary===sub) && m.name.toLowerCase().includes(q)).forEach(m=>{
    const pin = document.createElement("div");
    pin.className = "map-pin";
    pin.style.cssText = `position:absolute; left:${m.x}%; top:${m.y}%; transform:translate(-50%,-50%);`;
    pin.innerHTML = `<svg width="20" height="20"><circle cx="10" cy="10" r="${m.important?7:5.5}" fill="${m.important?'#DFAE24':'#1976D2'}" stroke="#fff" stroke-width="2"/></svg>`;
    pin.addEventListener("mousemove", (e)=>{
      const box = document.getElementById("mapStage").getBoundingClientRect();
      tooltip.style.left = (e.clientX-box.left+14)+"px";
      tooltip.style.top = (e.clientY-box.top-10)+"px";
      tooltip.style.display = "block";
      tooltip.innerHTML = `<div class="mt-name">${m.name}</div><div class="mt-meta">${m.subsidiary} · ${m.type}</div>`;
    });
    pin.addEventListener("mouseleave", ()=> tooltip.style.display="none");
    wrap.appendChild(pin);
  });
}

function afterAudit(){

}
function renderAuditTable(){
  const filter = document.getElementById("auditUserFilter")?.value || "all";

  document.getElementById("auditTableBody").innerHTML = rows.map(a=>`
    <tr><td class="mono small">${a.time}</td><td>${a.user}</td><td>${a.action}</td><td>${a.doc}</td>
    <td><span class="status-pill ${a.status==='green'?'done':a.status==='gold'?'review':'progress'}">${a.status==='green'?'Completed':a.status==='gold'?'Action':'Info'}</span></td></tr>
  `).join("");
}

/* ============================================================
   GLOBAL SEARCH
   ============================================================ */
function wireGlobalSearch(){
  const input = document.getElementById("globalSearchInput");
  const results = document.getElementById("globalSearchResults");
  input.addEventListener("input", ()=>{
    const q = input.value.trim().toLowerCase();
    if(!q){ results.classList.remove("show"); return; }
    const matches = SEARCH_INDEX.filter(i=> i.t.toLowerCase().includes(q) || i.m.toLowerCase().includes(q));
    results.innerHTML = matches.length ? matches.map(m=>`<div class="gs-item" data-page="${m.page}"><div class="t">${m.t}</div><div class="m">${m.m}</div></div>`).join("")
      : `<div class="gs-empty">No matches in demo index for “${input.value}”.</div>`;
    results.classList.add("show");
    results.querySelectorAll("[data-page]").forEach(el=> el.addEventListener("click", ()=>{ goTo(el.dataset.page); results.classList.remove("show"); input.value=""; }));
  });
  document.addEventListener("click", (e)=>{ if(!e.target.closest(".global-search")) results.classList.remove("show"); });
}

/* ============================================================
   MODAL + TOAST utilities
   ============================================================ */
function modalShell(id, title){
  return `
  <div class="modal-overlay" id="${id}">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="${id}_title">${title}</h3>
        <button class="modal-close" onclick="closeModal('${id}')">✕</button>
      </div>
      <div class="modal-body" id="${id}_body"></div>
    </div>
  </div>`;
}
function openModal(id){ document.getElementById(id).classList.add("show"); }
function closeModal(id){ document.getElementById(id).classList.remove("show"); }
document.addEventListener("click", (e)=>{
  if(e.target.classList && e.target.classList.contains("modal-overlay")) e.target.classList.remove("show");
});

let toastCount = 0;
function toast(title, message){
  const stack = document.getElementById("toastStack");
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<span class="ticon">◆</span><div><b>${title}</b><br><span style="opacity:.85;">${message}</span></div>`;
  stack.appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transform="translateX(30px)"; el.style.transition="all .3s"; setTimeout(()=> el.remove(), 300); }, 3600);
}
</script>

<!-- ============================================================
     PHASE 1 — API Service Boundary
     Added: Phase 1 Full-Stack Foundation
     ============================================================
     READ-ONLY addition. All existing mock data, UI, demo
     functionality, charts, navigation, and pages are preserved
     exactly. This script only adds apiServices and a silent
     background health check.
     ============================================================ -->
<script>
/* ============================================================
   CMPDI AI — Phase 1 API Service Boundary
   Establishes clean communication interfaces between the
   static frontend and the Django backend.

   - When backend is running: health check succeeds silently.
   - When backend is NOT running: graceful fallback, all mock
     data and demo UI continue working normally.
   - No existing UI behaviour is modified.
   ============================================================ */

const API_BASE = 'http://127.0.0.1:8000';
const API_TIMEOUT_MS = 5000;

/* --- Low-level fetch helper with timeout ------------------- */
async function _apiFetch(path, options = {}) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), API_TIMEOUT_MS);
  try {
    const res = await fetch(API_BASE + path, {
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      signal: controller.signal,
      ...options,
    });
    clearTimeout(timer);
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);
    return await res.json();
  } catch (err) {
    clearTimeout(timer);
    throw err;
  }
}

/* --- API Services ------------------------------------------ */
const apiServices = {
  /**
   * GET /api/health/
   * Returns backend status. Used for connectivity verification.
   */
  health: () => _apiFetch('/api/health/'),

  /**
   * Documents service — Phase 2
   */
  documents: {
    list:   () => _apiFetch('/api/documents/'),
    get:    (id) => _apiFetch(`/api/documents/${id}/`),
    upload: (formData) => _apiFetch('/api/documents/', { method: 'POST', body: formData, headers: {} }),
    delete: (id) => _apiFetch(`/api/documents/${id}/`, { method: 'DELETE' }),
  },

  /**
   * Analytics service — Phase 4
   */
  analytics: {
    summary:    () => _apiFetch('/api/analytics/'),
    production: (params) => _apiFetch('/api/analytics/production/' + (params ? '?' + new URLSearchParams(params) : '')),
  },

  /**
   * Chat / AI Query service — Phase 4
   */
  chat: {
    query: (message, context = {}) =>
      _apiFetch('/api/chat/', { method: 'POST', body: JSON.stringify({ message, context }) }),
  },

  /**
   * Excel AI Maintainer service — Phase 4
   */
  excel: {
    list:   () => _apiFetch('/api/excel/'),
    query:  (sheet_id, prompt) =>
      _apiFetch(`/api/excel/${sheet_id}/query/`, { method: 'POST', body: JSON.stringify({ prompt }) }),
  },

  /**
   * Reports service — Phase 4
   */
  reports: {
    list:     () => _apiFetch('/api/reports/'),
    generate: (params) => _apiFetch('/api/reports/', { method: 'POST', body: JSON.stringify(params) }),
  },

  /**
   * Topics service — Phase 4
   */
  topics: {
    list: () => _apiFetch('/api/topics/'),
  },

  /**
   * Audit service — Phase 2
   */
  audit: {
    list: (params) => _apiFetch('/api/audit/' + (params ? '?' + new URLSearchParams(params) : '')),
  },
};

/* --- Phase 1: Silent background health check --------------- */
let _backendOnline = false;

(async function _phase1HealthCheck() {
  try {
    const health = await apiServices.health();
    _backendOnline = true;
    console.info(
      '%c[CMPDI AI] Backend connected',
      'color:#1E9E63; font-weight:bold;',
      health
    );
  } catch (_err) {
    _backendOnline = false;
    console.info(
      '%c[CMPDI AI] Demo mode — backend not running. Mock data active.',
      'color:#DFAE24; font-weight:bold;'
    );
  }
})();

/* Expose backend status for future use */
window.CMPDI_AI = window.CMPDI_AI || {};
window.CMPDI_AI.apiServices = apiServices;
window.CMPDI_AI.isBackendOnline = () => _backendOnline;
window.CMPDI_AI.API_BASE = API_BASE;
</script>
