# render.yaml — Render Blueprint for CMPDI AI (Django full-stack)
# Deploy: https://dashboard.render.com ? New ? Blueprint
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: cmpdi-ai-backend
    runtime: python
    region: singapore          # Closest region to India
    plan: free                 # Change to starter/higher for real load
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --log-level info"
    healthCheckPath: /api/health/

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production

      - key: SECRET_KEY
        generateValue: true        # Render auto-generates a secure random value

      - key: ALLOWED_HOSTS
        value: "cmpdi-ai-backend.onrender.com"  # Update after first deploy

      - key: CSRF_TRUSTED_ORIGINS
        value: "https://cmpdi-ai-backend.onrender.com"  # Update after first deploy

      - key: CORS_ALLOWED_ORIGINS
        value: ""    # Blank — frontend is same-origin (Django serves it)

      - key: DATABASE_URL
        fromDatabase:
          name: cmpdi-ai-db
          property: connectionString

      - key: GEMINI_API_KEY
        sync: false  # Set manually in Render dashboard (keep secret)

      - key: PYTHON_VERSION
        value: "3.12.0"

databases:
  - name: cmpdi-ai-db
    databaseName: cmpdi_ai
    user: cmpdi_ai_user
    plan: free                 # Free tier — 90-day limit; upgrade for production
    region: singapore
